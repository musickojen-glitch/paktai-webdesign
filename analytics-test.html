<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทดสอบระบบสถิติ ปักษ์ใต้</title><style>body{font:18px system-ui,sans-serif;max-width:600px;margin:12vh auto;padding:24px}button{padding:15px 25px;background:#0756bd;color:white;border:0;border-radius:10px;font-size:18px}pre{white-space:pre-wrap;background:#eee;padding:20px;border-radius:8px}</style></head><body><h2>ทดสอบระบบบันทึกสถิติ</h2><p>หน้านี้เป็นเครื่องมือทดสอบชั่วคราว ไม่มีการเก็บชื่อหรือเบอร์โทร</p><button id="test">ทดสอบบันทึกข้อมูล</button><pre id="result">ยังไม่ได้ทดสอบ</pre><script>document.getElementById('test').onclick=async()=>{const out=document.getElementById('result');out.textContent='กำลังตรวจ...';try{const r=await fetch('/api/visitor-events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'page_view',source:'facebook',medium:'reels',campaign:'anek_hmamai',label:'preview_test'})});out.textContent='HTTP '+r.status+'\n'+await r.text()}catch(e){out.textContent='เชื่อมต่อไม่ได้: '+e.message}}</script></body></html>
