<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>สถิติปักษ์ใต้ — ผู้ดูแล</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1733;color:#fff;font:16px system-ui,"Tahoma",sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px}h1{font-size:30px;margin:0 0 8px}.sub{color:#b9c8e5}.login{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}input{background:#fff;border:0;border-radius:9px;padding:14px;font:inherit;min-width:260px;flex:1}button{border:0;border-radius:9px;background:#ffc94c;color:#17284d;padding:14px 22px;font-weight:800;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:22px 0}.card,.panel{background:#182c56;border:1px solid #37527f;border-radius:16px;padding:20px}.num{font-size:35px;font-weight:900;color:#ffd15b}.label{color:#c9d7f4}h2{font-size:20px}.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.panel{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #365079;overflow-wrap:anywhere}td:last-child,th:last-child{text-align:right}#msg{min-height:22px;color:#ffd15b}</style></head><body><main class="wrap"><h1>📊 สถิติปักษ์ใต้เว็บดีไซน์</h1><p class="sub">เฉพาะผู้ดูแล • ยอดจากเหตุการณ์ที่บันทึก ไม่ใช่จำนวนผู้เข้าชมที่ไม่ซ้ำ</p><div class="login"><button id="load">ดูสถิติ / โหลดใหม่</button></div><p id="msg" role="status">เข้าสู่ระบบผ่าน Cloudflare Access แล้วกดดูสถิติ</p><section id="dashboard" hidden><div class="cards" id="cards"></div><div class="sections"><div class="panel"><h2>แหล่งที่มา</h2><div id="sources"></div></div><div class="panel"><h2>แคมเปญ</h2><div id="campaigns"></div></div><div class="panel"><h2>ปุ่มที่มีคนกด</h2><div id="events"></div></div><div class="panel"><h2>เข้าชมย้อนหลัง 30 วัน</h2><div id="days"></div></div></div></section></main><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function table(rows,cols){if(!rows.length)return "<p>ยังไม่มีข้อมูล</p>";return "<table><thead><tr>"+cols.map(c=>"<th>"+esc(c[1])+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+cols.map(c=>"<td>"+esc(r[c[0]])+"</td>").join("")+"</tr>").join("")+"</tbody></table>"}
$("load").onclick=async()=>{$("msg").textContent="กำลังโหลด...";$("dashboard").hidden=true;try{const r=await fetch("/api/analytics-summary",{cache:"no-store"});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"HTTP "+r.status);const count=k=>d.totals.find(x=>x.event===k)?.count||0;$("cards").innerHTML=[["เปิดหน้าเว็บ",count("page_view")],["คลิกดูตัวอย่าง",count("sample_click")],["คลิกขอราคา",count("quote_click")],["คลิกติดต่อ",count("contact_click")]].map(x=>'<div class="card"><div class="num">'+x[1]+'</div><div class="label">'+x[0]+'</div></div>').join("");$("sources").innerHTML=table(d.sources,[["source","แหล่งที่มา"],["count","ครั้ง"]]);$("campaigns").innerHTML=table(d.campaigns,[["campaign","แคมเปญ"],["count","ครั้ง"]]);$("events").innerHTML=table(d.events,[["event","ประเภท"],["label","ปุ่ม"],["count","ครั้ง"]]);$("days").innerHTML=table(d.days,[["day","วันที่"],["count","ครั้ง"]]);$("dashboard").hidden=false;$("msg").textContent="โหลดข้อมูลสำเร็จ"}catch(e){$("msg").textContent="ไม่สามารถดูสถิติได้: "+e.message}};
</script></body></html>
